# Dựng và đăng app lên GitHub Pages.
#
# Vì sao cần: tunnel tạm (`cloudflared tunnel --url`) chỉ sống vài giờ rồi chết, và khi
# chết thì PWA đã cài trên iPad âm thầm chạy bản cache cũ hoặc không mở được. Một địa chỉ
# cố định làm mất hẳn lớp lỗi đó.
#
# Riêng tư: repo nội dung (ảnh/giọng của bé) KHÔNG nằm ở đây. Pages chỉ chứa mã và gói
# khởi đầu CC0/tự tạo; ảnh và giọng của bé luôn ở trong IndexedDB trên iPad.

name: Đăng lên GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Một lần đăng tại một thời điểm; không hủy bản đang chạy giữa chừng.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
        env:
          # Pages phục vụ app ở /<tên-repo>/, không phải gốc tên miền.
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
